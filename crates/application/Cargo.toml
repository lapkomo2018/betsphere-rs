[package]
name = "application"
version.workspace = true
edition.workspace = true

[dependencies]
domain = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Test-only, and deliberately a cycle: the broadcaster tests drive their
# handlers through infrastructure's in-memory repositories and broker rather
# than re-implementing them. Cargo allows cycles through dev-dependencies
# because they apply only to test targets — the `application` library itself
# still depends on nothing but `domain`. Tests using these must live in
# `tests/`, not in `src` behind `#[cfg(test)]`; see `tests/broadcasters.rs`.
[dev-dependencies]
infrastructure = { workspace = true }
tokio = { workspace = true }

# Dev: infrastructure only. The app runs natively on the host:
#   docker compose up -d
#   cargo run
# Values come from .env (compose loads it automatically).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local model server writing the demo bots' chat. Behind the `llm` profile,
  # so a plain `docker compose up -d` stays Postgres + Redis and nobody pays
  # for a model they didn't ask for:
  #   make llm-up      (or: docker compose --profile llm up -d)
  # Unpinned on purpose: the container holds no state — the models live in the
  # volume — and support for new ones lands in new releases.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Downloaded models, so a recreated container doesn't refetch gigabytes.
      - ollama_models:/root/.ollama
    healthcheck:
      # The CLI talks to the server it ships next to, so this answers only
      # once that server is actually listening.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # On an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host),
    # uncomment for a large speedup. CPU is fine for the small models this is
    # meant for.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the model the bots will ask for, then exits. Runs on
  # every `up` and is a no-op once the model is in the volume.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    entrypoint: ["/bin/ollama", "pull", "${DEMO_LLM_MODEL:-qwen2.5:0.5b}"]
    environment:
      # Pull into the server's volume rather than this container's filesystem.
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  ollama_models:

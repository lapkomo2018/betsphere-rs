# Prod: full stack with the API built as a release binary (no hot reload).
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: the database is reachable only from the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # No published port: the cache is reachable only from the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local model server writing the demo bots' chat, in-network only. Behind
  # the `llm` profile, so it starts only when asked for:
  #   docker compose -f docker-compose.prod.yml --profile llm up -d --build
  # Unpinned on purpose: the container holds no state — the models live in the
  # volume — and support for new ones lands in new releases.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # The CLI talks to the server it ships next to, so this answers only
      # once that server is actually listening.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # On an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host),
    # uncomment for a large speedup.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the model the bots will ask for, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    entrypoint: ["/bin/ollama", "pull", "${DEMO_LLM_MODEL:-qwen2.5:0.5b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Container-specific overrides; `environment` wins over `env_file`.
      BIND_ADDR: 0.0.0.0:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # in-network port, regardless of published POSTGRES_PORT
      REDIS_HOST: redis
      REDIS_PORT: "6379" # in-network port, regardless of published REDIS_PORT
      STORAGE_ROOT: /data/storage # pre-created in the image, backed by the volume below
      # Whatever DEMO_LLM_URL points at on the host, in here the model server
      # is a service name. Empty when the var is unset, which keeps the demo
      # bots on their canned lines — the api never waits on this service, so
      # running without the `llm` profile is a supported state, not a failure.
      DEMO_LLM_URL: ${DEMO_LLM_URL:+http://ollama:11434/v1/chat/completions}
    ports:
      - "${API_PORT}:8080"
    volumes:
      # Uploaded files (avatars) must survive container recreation.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  ollama_models:

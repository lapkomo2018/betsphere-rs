# Prod: full stack with the API built as a release binary (no hot reload).
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: the database is reachable only from the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # No published port: the cache is reachable only from the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Container-specific overrides; `environment` wins over `env_file`.
      BIND_ADDR: 0.0.0.0:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # in-network port, regardless of published POSTGRES_PORT
      REDIS_HOST: redis
      REDIS_PORT: "6379" # in-network port, regardless of published REDIS_PORT
      STORAGE_ROOT: /data/storage # pre-created in the image, backed by the volume below
    ports:
      - "${API_PORT}:8080"
    volumes:
      # Uploaded files (avatars) must survive container recreation.
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
